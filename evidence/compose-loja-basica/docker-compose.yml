# Gerado por generate_product.py — não edite à mão
name: loja-basica
services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
  auth-service:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "services.auth.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
      AUTH_VARIANT: "email"
  catalog-service:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "services.catalog.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8002:8002"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
      CATALOG_VARIANT: "simple"
  cart-service:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "services.cart.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8003:8003"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
  order-service:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "services.order.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports: ["8004:8004"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
  payment-service:
    build:
      context: ../..
      dockerfile: Dockerfile.service
    command: ["uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports: ["8005:8005"]
    volumes: ["lps-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"], interval: 10s, timeout: 3s, retries: 5}
    environment:
      ENABLED_SERVICES: "auth,catalog,cart,order,payment"
      AUTH_URL: "http://auth-service:8001"
      CATALOG_URL: "http://catalog-service:8002"
      CART_URL: "http://cart-service:8003"
      ORDER_URL: "http://order-service:8004"
      PAYMENT_URL: "http://payment-service:8005"
      PAYMENT_METHODS: "pix"
volumes:
  lps-data: {}
